<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Ingodspresence</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .thanks-card {
        background: white;
        border: 1px solid #f1d8ff;
        border-radius: 1.5rem;
        padding: 2rem;
        max-width: 560px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(30, 26, 23, 0.08);
      }
      .thanks-card h1 {
        margin-top: 0;
      }
      .thanks-card a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff5f7e 0%, #5b8cff 50%, #4ecdc4 100%);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="thanks-card">
      <p class="eyebrow">Thank you</p>
      <h1>You're on the mission list.</h1>
      <p>Thanks for joining Ingodspresence in living out Matthew 28:19. We'll send resources, training, and local opportunities to help you make disciples.</p>
      <a href="site.html">Back to the site</a>
    </div>
  </body>
</html>
